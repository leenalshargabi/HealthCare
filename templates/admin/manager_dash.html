{% extends "base.html" %}
{% block title %}Admin Panel{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block content %}

<div class="admin-container">

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">

        <h2>Admin</h2>

        <button onclick="showSection('add')">Add</button>
        <button onclick="window.location='/admin/reports'">Reports</button>
        <button onclick="showSection('addDB')">Add DB</button>
        <button onclick="showSection('collections')">Show Collections</button>

    </div>

    <!-- MAIN CONTENT -->
    <div class="main">

        <!-- TOP BAR -->
        <div class="topbar">
            <button onclick="toggleSidebar()">☰</button>

            <input type="text" id="search" placeholder="Search patients or doctors...">

            <select id="filter">
                <option value="all">All</option>
                <option value="patients">Patients</option>
                <option value="doctors">Doctors</option>
            </select>
        </div>

        <!-- DYNAMIC SECTIONS -->

        <div id="add" class="section">
            <h2>Add User / Doctor</h2>

            <form method="POST" action="/admin/add-user">
                <input name="name" placeholder="Name" required>
                <input name="email" placeholder="Email" required>
                
                <select name="role">
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                </select>

                <button type="submit">Add</button>
            </form>
        </div>

        <div id="addDB" class="section hidden">
            <h2>Create New Database</h2>

            <form method="POST" action="/admin/create-db">
                <input name="db_name" placeholder="Database Name">
                <button>Create</button>
            </form>
        </div>

        <div id="collections" class="section hidden">
            <h2>Collections</h2>
            <div id="collectionsList"></div>
        </div>

    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
