{% extends "/admin/baseDashboard.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<style>
    /* تنسيق خاص ومنفصل للتقارير */
    .reports-wrapper {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 20px;
        background: #f0f2f5; /* لون خلفية مختلف */
    }
    .report-box {
        background: white;
        border: 2px solid #7BA4D0;
        border-radius: 12px;
        padding: 15px;
        flex: 1;
        min-width: 300px;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .report-box img {
        max-width: 100%;
        height: auto;
    }
</style>

<div class="reports-wrapper">
    <div class="report-box">
        <h3>Distribution of User Roles</h3>
        <img src="{{ user_chart }}" alt="User Stats Chart">
    </div>

    <div class="report-box">
        <h3>Appointment Status Overview</h3>
        <img src="{{ appt_chart }}" alt="Appointment Stats Chart">
    </div>
</div>
{% endblock %}
