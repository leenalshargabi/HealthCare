<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>News & Updates</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/news.css') }}">
</head>
<body>

<!-- Full Width Header -->
<div class="top-header">
    <h1>News & Updates</h1>
    <p>Stay informed about the latest hospital announcements</p>
</div>

<div class="page-container">

    <!-- Filter -->
    <div class="filter-bar">
        <label for="dateFilter">Filter by</label>
        <select id="dateFilter">
            <option value="all">All</option>
            <option value="new">Most Recent</option>
            <option value="old">Oldest First</option>
        </select>
        <button class="filter-btn" onclick="applyFilter()">Filter</button>
    </div>

    <!-- News Grid -->
    <div id="newsGrid" class="news-grid"></div>

    <!-- Pagination -->
    <div id="pagination" class="pagination"></div>
    <div class="more-pagination-container">
        <button id="morePagesBtn" onclick="loadMorePages()">More</button>
    </div>

</div>

<script>
    let newsData = {{ news | tojson }};
</script>
<script src="{{ url_for('static', filename='js/news.js') }}"></script>

</body>
</html>
