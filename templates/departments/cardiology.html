<!DOCTYPE html>
<html>
<head>
  <title>Cardiology</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/department.css') }}">
  <script defer src="{{ url_for('static', filename='js/department.js') }}"></script>
</head>
<body class="cardiology-theme">

<button class="return-btn" onclick="goBack()">Return</button>

<div class="hero">
  <h1>Cardiology Department</h1>
  <p>Advanced heart care, prevention, diagnosis, and life-saving treatments.</p>
</div>

<div class="section">
  <h2>Our Cardiologists</h2>

  <div class="doctors">
    {% for doctor in cDoctors %}
    <div class="doctor">
      <h3>{{ doctor.fullName }}</h3>
      <span>{{doctor.mainSpecialty }}</span>
      <p>{{doctor.subSpecialty }}</p>
      <p>{{doctor.workingHours }}</p>
    </div>
    {% endfor %}
  </div>

</div>

</body>

</html>
