<!DOCTYPE html>
<html>
<head>
  <title>Orthopedics</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/department.css') }}">
</head>
<body style="background:#F5F6F7; color:#2B2E33;">

<div class="hero" style="background:#7B7F85; color:#fff;">
  <h1>Orthopedics Department</h1>
  <p>Comprehensive care for bones, joints, muscles, and sports injuries.</p>
</div>

<div class="section">
  <h2>Our Orthopedic Doctors</h2>

  <div class="doctors">
    {% for doctor in cDoctors %}
    <div class="doctor" style="background:#fff;">
      <h3>{{ doctor.fullName }}</h3>
      <span>{{doctor.mainSpecialty }}</span>
      <p>{{doctor.subSpecialty }}</p>
    </div>
    {% endfor %}
  </div>
</div>

</body>
</html>
