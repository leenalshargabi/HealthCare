<!DOCTYPE html>
<html>
<head>
  <title>Neurology</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/department.css') }}">
</head>
<body style="background:#FFFCFC; color:#5D3543;">

<div class="hero" style="background:#785964; color:#fff;">
  <h1>Neurology Department</h1>
  <p>Expert care for brain, spinal cord, and nervous system disorders.</p>
</div>

<div class="section">
  <h2>Our Neurologists</h2>

  <div class="doctors">
    {% for doctor in cDoctors %}
    <div class="doctor" style="background:#fff;">
      <h3>{{ doctor.fullName }}</h3>
      <span>{{doctor.mainSpecialty }}</span>
      <p>{{doctor.subSpecialty }}</p>
    </div>
    {% endfor %}
  </div>
</div>

</body>
</html>
