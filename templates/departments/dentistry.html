<!DOCTYPE html>
<html>
<head>
  <title>Dental Care</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/department.css') }}">
  <script defer src="{{ url_for('static', filename='js/department.js') }}"></script>
</head>
<body class="dentistry-theme">

  <div class="dept-navbar">
    <div class="dept-logo">NovaCare</div>

    <div class="dept-links">
        <a href="/">Home</a>
        <a href="/specialities">Specialities</a>
        <a href="/about">About</a>
    </div>
</div>


<div class="hero">
  <div class="hero-content">
      <h1>Dental Care Department</h1>
      <p>Healthy smiles through advanced dental and cosmetic treatments.</p>
  </div>

  <div class="wave"></div>

</div>

<button class="return-btn" onclick="goBack()">Return</button>

<div class="section">
  <h2>Our Dentists</h2>

  <div class="doctors" id="doctor-list">
  {% for doctor in cDoctors %}
  <div class="doctor doctor-item">
  <div class="doctor-top">
    <img src="{{ url_for('static', filename='images/DC.png') }}" class="doctor-img">

    <div class="availability available">
        Available
    </div>
  </div>

  <h3>{{ doctor.fullName }}</h3>
  <span>{{doctor.mainSpecialty }}</span>
  <p>{{doctor.subSpecialty }}</p>
  <p>{{doctor.workingHours }}</p>

</div>

    {% endfor %}
  </div>

  <div class="pagination" id="pagination"></div>

</div>

</body>

</html>
