<!DOCTYPE html>
<html>
<head>
  <title>Dental Care</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/department.css') }}">
</head>
<body style="background:#E8F0F1; color:#004B57;">

<div class="hero" style="background:#C7E7EC;">
  <h1>Dental Care Department</h1>
  <p>Healthy smiles through advanced dental and cosmetic treatments.</p>
</div>

<div class="section">
  <h2>Our Dentists</h2>

  <div class="doctors">
    {% for doctor in cDoctors %}
    <div class="doctor" style="background:#fff;">
      <h3>{{ doctor.fullName }}</h3>
      <span>{{doctor.mainSpecialty }}</span>
      <p>{{doctor.subSpecialty }}</p>
    </div>
    {% endfor %}
  </div>
</div>

</body>
</html>
